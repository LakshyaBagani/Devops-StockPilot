# Tool configuration only (ruff, coverage). Dependencies live in requirements*.txt and
# pytest reads pytest.ini.

[tool.ruff]
target-version = "py311"  # the README promises Python >= 3.11
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "S", "RUF"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603"]
"conftest.py" = ["S101"]
# Seedable PRNGs on purpose: simulation and demo data, not cryptography.
"app/services/planner.py" = ["S311"]
"app/seed.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ holds the migration scripts; without this, ruff files the alembic package
# under first-party imports.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
# Applies whenever pytest runs with --cov (make cov, CI); a plain `pytest` never measures.
fail_under = 85
