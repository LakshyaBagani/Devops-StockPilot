# Production defaults, shaped for EKS: a deploy with only this file still gets the Ingress, the HPA
# and at least 2 replicas of each tier. values-kind.yaml and values-eks.yaml layer on top.
# Ports are constants in the templates, not values: backend 8000 (named http), frontend 80 -> 8080,
# postgres 5432. The nginx config, the load generator, the labs and the ServiceMonitor rely on them.
# No credentials here: the database Secret is created out of band (postgres.existingSecret).

fullnameOverride: "" # names come from the release: stockpilot-backend, -frontend, -postgres
clusterDomain: cluster.local
imagePullSecrets: [] # only for the private-GHCR fallback

backend:
  image:
    repository: ghcr.io/lakshyabagani/stockpilot-backend
    tag: "" # empty falls back to .Chart.AppVersion; CI and make kind-deploy always set it
    pullPolicy: IfNotPresent
  gitSha: dev # GIT_SHA, reported by /api/version; CI sets the full 40-character SHA
  replicaCount: 2 # used only when autoscaling is off; otherwise the HPA owns the replica count
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    scaleDownStabilizationWindowSeconds: 60 # Kubernetes defaults to 300; shortened for the live demo
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Non-secret settings, delivered as env vars through the ConfigMap. Keep every value a quoted
  # string: an unquoted 4000000 would render as 4e+06.
  config:
    PLANNER_DEFAULT_SCENARIOS: "1000"
    PLANNER_MAX_WORK: "4000000"
    PLANNER_MAX_CONCURRENCY: "2"
    PLANNER_QUEUE_TIMEOUT_S: "30"
    LEAD_TIME_SPREAD: "0.7,1.0,1.6"
  service:
    annotations: {} # the ALB fallback puts its health-check path here
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  image:
    repository: ghcr.io/lakshyabagani/stockpilot-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  pdb:
    enabled: true
    minAvailable: 1

postgres:
  # The multi-arch index digest, the same as PG_IMAGE in the root Makefile (compose and tests).
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  # Keys username, password and database. make kind-up / make eks-bootstrap create it, and never
  # rotate it: Postgres reads the password only when it initialises the volume.
  existingSecret: stockpilot-db
  storage:
    size: 5Gi
    storageClassName: "" # empty: the cluster's default class (EBS gp3 on EKS)
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # true: run as uid/gid 70 from the start with all capabilities dropped (restricted-compatible).
  # Off by default: the verified pattern lets the official image start as root and drop to uid 70.
  hardened: false

migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600 # a failed hook Job stays 10 minutes for kubectl logs

ingress:
  enabled: true
  className: traefik
  host: "" # empty: match any host (the LB hostname or localhost)
  annotations: {}

metrics:
  serviceMonitor:
    enabled: true # rendered only when the cluster serves monitoring.coreos.com/v1 ServiceMonitor
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  dashboard:
    enabled: true

tests:
  enabled: true
