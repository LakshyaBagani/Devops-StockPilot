{{- $component := dict "root" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpilot.componentName" $component }}
  labels:
    {{- include "stockpilot.labels" $component | nindent 4 }}
spec:
  {{- /* With the HPA on, a replicas field here would reset the HPA's count on every upgrade. */}}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockpilot.labels" $component | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "stockpilot.podSecurityContext" 10001 | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend # the dashboard's CPU panel filters on container="backend"
          image: {{ include "stockpilot.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "stockpilot.componentName" (dict "root" . "component" "backend-config") }}
          env:
            {{- include "stockpilot.dbEnv" . | nindent 12 }}
            - name: GIT_SHA
              value: {{ .Values.backend.gitSha | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              # Keeps serving while the endpoint removal reaches Traefik and kube-proxy.
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "stockpilot.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
