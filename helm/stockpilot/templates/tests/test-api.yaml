{{- if .Values.tests.enabled }}
{{- $component := dict "root" . "component" "test" -}}
# helm test: proves the routing, the deployed git SHA, a migrated schema and the nginx FQDN proxy.
# It runs the backend image (already on the node, Trivy-scanned, numeric USER) with Python's
# urllib, so no extra image is pulled. Nothing is templated inside the script.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stockpilot.componentName" $component }}-api
  labels:
    {{- include "stockpilot.labels" $component | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  enableServiceLinks: false
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- include "stockpilot.podSecurityContext" 10001 | nindent 4 }}
  containers:
    - name: test-api
      image: {{ include "stockpilot.image" (dict "root" . "image" .Values.backend.image) | quote }}
      imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
      env:
        - name: BACKEND_URL
          value: "http://{{ include "stockpilot.componentName" (dict "root" . "component" "backend") }}:8000"
        - name: FRONTEND_URL
          value: "http://{{ include "stockpilot.componentName" (dict "root" . "component" "frontend") }}:80"
        - name: EXPECTED_GIT_SHA
          value: {{ .Values.backend.gitSha | quote }}
      command:
        - python
        - -c
        - |
          import json, os, urllib.request

          def get(url):
              # urlopen raises HTTPError on any 4xx/5xx, which fails the test.
              with urllib.request.urlopen(url, timeout=10) as response:
                  print(response.status, url)
                  return response.read()

          backend, frontend = os.environ["BACKEND_URL"], os.environ["FRONTEND_URL"]
          get(backend + "/ready")
          sha = json.loads(get(backend + "/api/version"))["git_sha"]
          if sha != os.environ["EXPECTED_GIT_SHA"]:
              raise SystemExit(f"git_sha {sha} != expected {os.environ['EXPECTED_GIT_SHA']}")
          get(backend + "/api/products?limit=1")  # a DB-backed route: the migration ran
          get(frontend + "/healthz")
          get(frontend + "/api/version")  # the nginx proxy to the backend FQDN
          print("ok", sha)
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        {{- include "stockpilot.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
{{- end }}
