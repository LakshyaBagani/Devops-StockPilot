{{- if .Values.metrics.dashboard.enabled }}
# Dashboard as code: the Grafana sidecar (searchNamespace ALL) loads every ConfigMap labelled
# grafana_dashboard: "1". The JSON comes in through .Files.Get because Grafana's legend templates
# would break Helm's template parsing in an inline copy. The data key must end in .json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.componentName" (dict "root" . "component" "dashboard") }}
  labels:
    {{- include "stockpilot.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
{{ .Files.Get "dashboards/stockpilot.json" | indent 4 }}
{{- end }}
