{{- $component := dict "root" . "component" "frontend" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.componentName" $component }}
  labels:
    {{- include "stockpilot.labels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
