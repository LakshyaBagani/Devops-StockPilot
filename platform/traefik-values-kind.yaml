# Traefik chart 41.7.1 (Traefik v3.7.14) on kind: a NodePort behind the kind port mapping, so
# http://localhost:8080 reaches the Ingress. make kind-up installs it (sp_traefik in
# scripts/lib/platform.sh):
#   helm upgrade --install traefik traefik --repo https://traefik.github.io/charts --version 41.7.1 \
#     -n traefik -f platform/traefik-values-kind.yaml --wait --timeout 10m
# The release must be named traefik: the chart then creates IngressClass traefik, marked default.
service:
  spec:
    type: NodePort # 41.x reads service.spec.type; service.type is silently ignored
ports:
  web:
    nodePort: 30080 # must equal containerPort in k8s/kind-config.yaml (published on 127.0.0.1:8080)
providers:
  kubernetesIngress:
    publishedService:
      enabled: false # a NodePort has no load balancer address to publish into Ingress status
