# Load generator for the HPA demo: WORKERS parallel loops call the CPU-bound reorder planner
# with the UI's default query (no scenarios=, so the server default applies), which pushes the
# backend past the HPA's 60% CPU target.
#   Start  make loadtest       (checks first that the planner answers with a seeded plan)
#   Stop   make loadtest-stop  (or it stops itself after activeDeadlineSeconds)
#   Status kubectl -n default get job stockpilot-loadgen -o jsonpath='{.status.active}'  (empty: stopped)
# It runs in namespace default, never stockpilot, so the graded namespace stays all-Running.
# scripts/load-test.sh reads TARGET_URL and the image from this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: stockpilot-loadgen
  namespace: default
  labels:
    app.kubernetes.io/name: stockpilot-loadgen
    app.kubernetes.io/part-of: stockpilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockpilot-loadgen
        app.kubernetes.io/part-of: stockpilot
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          env:
            - name: TARGET_URL
              value: "http://stockpilot-backend.stockpilot.svc.cluster.local:8000/api/reorder-plan?service_level=95&horizon_days=30"
            - name: WORKERS
              value: "4"
          # $$( escapes Kubernetes' own $(VAR) expansion. wget exits non-zero on any HTTP error,
          # and the sleep keeps an erroring backend from turning the loop into a hot spin.
          command: ["/bin/sh", "-c"]
          args:
            - for i in $$(seq "$WORKERS"); do (while true; do wget -q -T 30 -O /dev/null "$TARGET_URL" || sleep 1; done) & done; wait
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
